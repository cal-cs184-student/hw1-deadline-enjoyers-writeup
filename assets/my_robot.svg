<?xml version="1.0" encoding="utf-8"?>
<!-- Cubeman, waving.  Modified from svg/transforms/robot.svg: the left arm is
     raised with a bent elbow, the head is tinted and tilted, and the stance is
     slightly wider. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="500.0px" height="500.0px" viewBox="0 0 500 500" enable-background="new 0 0 500 500"
	 xml:space="preserve">

<g transform="translate(250 250)">
	<!-- torso -->
	<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
	<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>

	<!-- head (tinted, tilted a little) -->
	<g transform="translate(0 -100) rotate(-15)">
		<g transform="rotate(45)">
			<g transform="scale(.5 .5)">
				<polygon fill="#FFB300" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#FFB300" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- left leg (stepped out a little) -->
	<g transform="translate(-45 90) rotate(-8)">
		<g transform="scale(.2 .6)">
			<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
			<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
		</g>
		<g transform="translate(0 70)">
			<g transform="scale(.2 .6)">
				<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- right leg -->
	<g transform="translate(40 90)">
		<g transform="scale(.2 .6)">
			<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
			<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
		</g>
		<g transform="translate(0 70)">
			<g transform="scale(.2 .6)">
				<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- left arm, raised and bent: waving -->
	<g transform="translate(-90 -40) rotate(70)">
		<g transform="scale(.6 .2)">
			<polygon fill="#2E86DE" points="-50,-50 50,-50 -50,50 "/>
			<polygon fill="#2E86DE" points="-50,50 50,-50 50,50"/>
		</g>
		<g transform="translate(-70 0) rotate(20)">
			<g transform="scale(.6 .2)">
				<polygon fill="#2E86DE" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#2E86DE" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- right arm, hanging down a little -->
	<g transform="translate(90 -30) rotate(-20)">
		<g transform="scale(.6 .2)">
			<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
			<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
		</g>
		<g transform="translate(70 0)">
			<g transform="scale(.6 .2)">
				<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

</g>

</svg>
